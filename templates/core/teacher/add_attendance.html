{% extends 'base.html' %}

{% block title %}Enregistrer une absence/retard{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-person-x"></i> Enregistrer une absence / un retard</h2>

<form method="post" class="card card-body shadow-sm">
    {% csrf_token %}

    <div class="mb-3">
        <label for="id_class" class="form-label">Classe</label>
        <select name="class" id="id_class" class="form-select" required>
            <option value="" selected disabled>-- Sélectionner une classe --</option>
            {% for class in classes %}
            <option value="{{ class.id }}">{{ class.name }} ({{ class.academic_year }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="id_student" class="form-label">Élève</label>
        <select name="student" id="id_student" class="form-select" required>
            <option value="" selected disabled>-- Sélectionner un élève --</option>
            {% for student in students %}
            <option value="{{ student.id }}" data-class="{{ student.current_class.id }}">{{ student.get_full_name }} ({{ student.student_number }}) - {{ student.current_class.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="id_status" class="form-label">Statut</label>
        <select name="status" id="id_status" class="form-select" required>
            <option value="ABSENT">Absent</option>
            <option value="RETARD">Retard</option>
            <option value="JUSTIFIE">Absence justifiée</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="id_date" class="form-label">Date</label>
        <input type="date" name="date" id="id_date" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="id_reason" class="form-label">Raison (optionnel)</label>
        <textarea name="reason" id="id_reason" class="form-control" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-circle"></i> Enregistrer
    </button>
</form>

<script>
// Filtrer les élèves selon la classe sélectionnée
document.getElementById('id_class').addEventListener('change', function() {
    const selectedClassId = this.value;
    const studentSelect = document.getElementById('id_student');
    const allOptions = studentSelect.querySelectorAll('option');
    
    // Réinitialiser la sélection
    studentSelect.value = '';
    
    // Afficher/masquer les options selon la classe
    allOptions.forEach(option => {
        if (option.value === '') {
            // Garder l'option par défaut visible
            option.style.display = '';
        } else {
            const studentClassId = option.getAttribute('data-class');
            if (selectedClassId && studentClassId !== selectedClassId) {
                option.style.display = 'none';
            } else {
                option.style.display = '';
            }
        }
    });
});
</script>
{% endblock %}
